version: "3.9"
services:
  web:
    build: .
    container_name: joshkirk-web
    environment:
      - NODE_ENV=production
      - NEXTAUTH_URL=http://localhost:3000
    env_file:
      - .env
    ports:
      - "3000:3000"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: joshkirk-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  caddy_data: {}
  caddy_config: {}

