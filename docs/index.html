<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#171812">
    <meta name="description" content="Josh Kirk">
    <title>Josh Kirk</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; }
      * { box-sizing: border-box; }
      html { min-height: 100%; }
      body { min-height: 100vh; margin: 0; background: #171812; color: #fff; }
      .page { position: relative; isolation: isolate; min-height: 100vh; min-height: 100svh; overflow: hidden; }
      .photo, .shade { position: absolute; inset: 0; width: 100%; height: 100%; }
      .photo { z-index: -2; object-fit: cover; object-position: 52% center; }
      .shade { z-index: -1; background: linear-gradient(180deg, rgba(10, 15, 15, .45), transparent 35%); }
      header { width: min(100% - 3rem, 1200px); margin-inline: auto; }
      header { padding-block: 2rem; font-size: .95rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      @media (max-width: 650px) {
        header { width: min(100% - 2.5rem, 1200px); }
        header { padding-block: 1.5rem; }
        .photo { object-position: 62% center; }
        .shade { background: linear-gradient(180deg, rgba(10, 15, 15, .5), transparent 35%); }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <img class="photo" src="assets/sunset.jpg" alt="Sun setting over distant hills beneath a warm orange sky">
      <div class="shade" aria-hidden="true"></div>
      <header>Josh Kirk</header>
    </div>
  </body>
</html>
